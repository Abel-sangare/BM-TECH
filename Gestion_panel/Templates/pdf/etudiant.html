<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
    body {
        font-family: Arial;
        font-size: 12px;
    }
    .carte {
        width: 350px;
        height: 200px;
        border: 2px solid #000;
        padding: 10px;
    }
    .photo {
        width: 80px;
        height: 80px;
        border: 1px solid #000;
    }
</style>
</head>

<body>
<div class="carte">
    <h3>CARTE ÉTUDIANT</h3>

    {% if etudiant.photo %}
        <img src="{{ etudiant.photo.path }}" class="photo">
    {% endif %}

    <p><strong>Nom :</strong> {{ etudiant.nom }}</p>
    <p><strong>Prénom :</strong> {{ etudiant.prenom }}</p>
    <p><strong>Téléphone :</strong> {{ etudiant.telephone }}</p>
    <p><strong>Statut :</strong> {{ etudiant.statut }}</p>
</div>
</body>
</html>
